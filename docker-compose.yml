# Produção no VPS: docker compose up -d
# Requer um arquivo .env (veja .env.example) e o DNS do domínio apontando para o VPS.
services:
  caddy:
    build:
      context: .
      dockerfile: painel/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - caddy_data:/data
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pedidos:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/pedidos
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    volumes:
      - media:/app/media
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pedidos:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/pedidos
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    command: arq app.worker.WorkerSettings
    volumes:
      - media:/app/media
      - ./secrets:/app/secrets:ro
    depends_on:
      - api

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  caddy_data:
  pgdata:
  redisdata:
  media:
